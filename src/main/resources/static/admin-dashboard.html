<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – RetroMart</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <span>Admin Dashboard</span>
    </div>

    <h1 class="page-title">Admin Dashboard</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <h3>Total Users</h3>
        <div class="stat-value" id="userCount">--</div>
        <button class="btn btn-blue" onclick="loadUsers()">View Users</button>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <h3>Total Products</h3>
        <div class="stat-value" id="productCount">--</div>
        <button class="btn btn-blue" onclick="loadProducts()">View Products</button>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🛒</div>
        <h3>Total Orders</h3>
        <div class="stat-value" id="orderCount">--</div>
        <button class="btn btn-blue" onclick="loadOrders()">View Orders</button>
      </div>
    </div>

    <div class="admin-content" id="contentSection">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <p>Click a card above to view detailed data.</p>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="/js/common.js"></script>
  <script>
    async function loadDashboard() {
      try {
        const [u, p, o] = await Promise.all([
          fetch('/api/users').then(r => r.json()),
          fetch('/api/products').then(r => r.json()),
          fetch('/api/orders').then(r => r.json())
        ]);
        document.getElementById('userCount').textContent = u.length;
        document.getElementById('productCount').textContent = p.length;
        document.getElementById('orderCount').textContent = o.length;
      } catch (err) {
        console.error('Dashboard load error', err);
      }
    }

    function buildTable(headers, rows) {
      let html = '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>';
      headers.forEach(h => { html += `<th>${h}</th>`; });
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>';
        r.forEach(c => { html += `<td>${c}</td>`; });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    async function loadUsers() {
      const users = await fetch('/api/users').then(r => r.json());
      document.getElementById('contentSection').innerHTML =
        '<h3>All Users</h3>' + buildTable(
          ['ID', 'Name', 'Email', 'Type'],
          users.map(u => [u.userId, u.name, u.email, u.userType])
        );
    }

    async function loadProducts() {
      const products = await fetch('/api/products').then(r => r.json());
      document.getElementById('contentSection').innerHTML =
        '<h3>All Products</h3>' + buildTable(
          ['ID', 'Title', 'Price', 'Seller'],
          products.map(p => [p.productId, p.title, '₹' + p.price, p.sellerId])
        );
    }

    async function loadOrders() {
      const orders = await fetch('/api/orders').then(r => r.json());
      document.getElementById('contentSection').innerHTML =
        '<h3>All Orders</h3>' + buildTable(
          ['ID', 'Product', 'Buyer', 'Payment', 'Delivery'],
          orders.map(o => [o.orderId, o.productId, o.buyerId, o.paymentStatus, o.deliveryStatus])
        );
    }

    loadDashboard();
  </script>
</body>
</html>
