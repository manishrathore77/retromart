<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment – RetroMart</title>
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    .pay-methods { margin-top: 20px; }
    .pay-methods h3 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .pay-option {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: #fff;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .pay-option:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .pay-option.upi { border-color: #e8f5e9; background: #fafffa; }
    .pay-option.upi:hover { border-color: #2e7d32; }
    .pay-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .pay-icon.upi-bg { background: #e8f5e9; }
    .pay-icon.card-bg { background: #e3f2fd; }
    .pay-icon.all-bg { background: #fff3e0; }
    .pay-option-info { flex: 1; }
    .pay-option-info strong { display: block; font-size: 15px; margin-bottom: 2px; }
    .pay-option-info span { font-size: 12px; color: var(--text-muted); }
    .pay-arrow { color: var(--text-light); font-size: 18px; }
    .upi-apps { display: flex; gap: 6px; margin-top: 6px; }
    .upi-apps span {
      font-size: 10px;
      background: #fff;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <a href="my-orders.html">Orders</a>
      <span>›</span>
      <span>Payment</span>
    </div>

    <div class="checkout-card" style="max-width:560px;margin:0 auto;">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:48px;">💳</div>
        <h2 style="margin:8px 0;">Complete Payment</h2>
        <p class="text-muted">Choose your preferred payment method</p>
      </div>

      <div class="order-product" id="orderSummary">
        <p class="text-muted">Loading order...</p>
      </div>

      <div class="price-summary">
        <div class="price-row-item"><span>Item total</span><span id="itemTotal">₹0</span></div>
        <div class="price-row-item"><span>Delivery</span><span style="color:var(--success);">FREE</span></div>
        <div class="price-row-item total"><span>Amount to Pay</span><span id="orderTotal">₹0</span></div>
      </div>

      <div class="pay-methods" id="payMethods">
        <h3>Select Payment Method</h3>

        <button class="pay-option upi" onclick="startPayment('upi')" id="upiBtn">
          <div class="pay-icon upi-bg">📱</div>
          <div class="pay-option-info">
            <strong>Pay with UPI</strong>
            <span>Google Pay, PhonePe, Paytm & more</span>
            <div class="upi-apps">
              <span>GPay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span>
            </div>
          </div>
          <span class="pay-arrow">›</span>
        </button>

        <button class="pay-option" onclick="startPayment('card')" id="cardBtn">
          <div class="pay-icon card-bg">💳</div>
          <div class="pay-option-info">
            <strong>Credit / Debit Card</strong>
            <span>Visa, Mastercard, RuPay & more</span>
          </div>
          <span class="pay-arrow">›</span>
        </button>

        <button class="pay-option" onclick="startPayment('all')" id="allBtn">
          <div class="pay-icon all-bg">🏦</div>
          <div class="pay-option-info">
            <strong>Netbanking / Wallets</strong>
            <span>All Razorpay payment options</span>
          </div>
          <span class="pay-arrow">›</span>
        </button>
      </div>

      <div class="message" id="msg"></div>
      <p class="text-center text-muted mt-2" style="font-size:12px;">🔒 256-bit SSL encrypted · Powered by Razorpay</p>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="/js/common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = parseInt(urlParams.get('orderId'));
    const amount = parseFloat(urlParams.get('amount')) || 0;
    let buyer = null;
    let productTitle = 'Product';
    let activePaymentMode = 'Razorpay';

    function setButtonsDisabled(disabled) {
      ['upiBtn', 'cardBtn', 'allBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = disabled;
      });
    }

    async function init() {
      buyer = await RetroMart.restoreSession();
      if (!buyer) {
        window.location.href = `login.html?redirect=payment.html?orderId=${orderId}&amount=${amount}`;
        return;
      }

      if (!orderId || !amount) {
        document.getElementById('msg').textContent = 'Invalid payment link.';
        document.getElementById('msg').className = 'message error';
        setButtonsDisabled(true);
        return;
      }

      const orderRes = await fetch(`/api/orders/${orderId}`);
      if (!orderRes.ok) {
        document.getElementById('msg').textContent = 'Order not found.';
        document.getElementById('msg').className = 'message error';
        return;
      }

      const order = await orderRes.json();
      if ((order.paymentStatus || '').toLowerCase() === 'paid') {
        window.location.href = `receipt.html?orderId=${orderId}`;
        return;
      }

      const pRes = await fetch(`/api/products/${order.productId}`);
      const product = pRes.ok ? await pRes.json() : { title: 'Product', price: amount };
      productTitle = product.title;
      const imgUrl = await RetroMart.fetchProductImage(order.productId);

      document.getElementById('orderSummary').innerHTML = `
        <img src="${imgUrl || 'https://via.placeholder.com/120?text=No+Image'}" alt="${product.title}" />
        <div class="order-product-info">
          <h3>${product.title}</h3>
          <div class="price">₹${Number(product.price).toLocaleString('en-IN')}</div>
          <p>Order #${order.orderId}</p>
          <p style="font-size:13px;color:var(--text-muted);">📍 ${order.shippingAddress || ''}</p>
        </div>
      `;

      const formatted = '₹' + Number(product.price).toLocaleString('en-IN');
      document.getElementById('itemTotal').textContent = formatted;
      document.getElementById('orderTotal').textContent = formatted;
    }

    function getRazorpayConfig(mode) {
      if (mode === 'upi') {
        return {
          display: {
            blocks: {
              upi: {
                name: 'Pay using UPI',
                instruments: [{ method: 'upi' }]
              }
            },
            sequence: ['block.upi'],
            preferences: { show_default_blocks: false }
          }
        };
      }
      if (mode === 'card') {
        return {
          display: {
            blocks: {
              card: {
                name: 'Pay using Card',
                instruments: [{ method: 'card' }]
              }
            },
            sequence: ['block.card'],
            preferences: { show_default_blocks: false }
          }
        };
      }
      return {
        display: {
          blocks: {
            upi: {
              name: 'UPI',
              instruments: [{ method: 'upi' }]
            },
            others: {
              name: 'Cards, Netbanking & Wallets',
              instruments: [
                { method: 'card' },
                { method: 'netbanking' },
                { method: 'wallet' }
              ]
            }
          },
          sequence: ['block.upi', 'block.others'],
          preferences: { show_default_blocks: false }
        }
      };
    }

    function getPaymentModeLabel(mode) {
      if (mode === 'upi') return 'UPI';
      if (mode === 'card') return 'Card';
      return 'Razorpay';
    }

    async function confirmOrderPayment(paymentId, mode) {
      const msg = document.getElementById('msg');
      msg.textContent = 'Confirming payment...';
      const txnRes = await fetch(`/api/orders/${orderId}/confirm`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          transactionId: paymentId,
          paymentStatus: 'paid',
          paymentMode: getPaymentModeLabel(mode)
        })
      });

      if (txnRes.ok) {
        window.location.href = `receipt.html?orderId=${orderId}&txn=${paymentId}`;
      } else {
        msg.textContent = 'Payment received (Txn: ' + paymentId + ') but order update failed.';
        msg.className = 'message error';
        setButtonsDisabled(false);
      }
    }

    async function startPayment(mode) {
      const msg = document.getElementById('msg');
      activePaymentMode = mode;
      setButtonsDisabled(true);
      msg.textContent = 'Opening Razorpay...';
      msg.className = 'message';

      const res = await fetch('/api/payment/razorpay-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount })
      });

      if (!res.ok) {
        msg.textContent = await res.text() || 'Payment initialization failed.';
        msg.className = 'message error';
        setButtonsDisabled(false);
        return;
      }

      const data = await res.json();

      if (data.demo) {
        if (!confirm(`Demo Payment (${getPaymentModeLabel(mode)})\n\nAmount: ₹${amount.toLocaleString('en-IN')}`)) {
          setButtonsDisabled(false);
          msg.textContent = '';
          return;
        }
        await confirmOrderPayment('demo_pay_' + Date.now(), mode);
        return;
      }

      const { orderId: razorId, key } = data;

      const options = {
        key,
        amount: Math.round(amount * 100),
        currency: 'INR',
        name: 'RetroMart',
        description: productTitle,
        order_id: razorId,
        config: getRazorpayConfig(mode),
        handler: async function(response) {
          await confirmOrderPayment(response.razorpay_payment_id, mode);
        },
        modal: {
          ondismiss: function() {
            setButtonsDisabled(false);
            msg.textContent = '';
          }
        },
        prefill: {
          name: buyer?.name || 'Guest',
          email: buyer?.email || '',
          contact: buyer?.phone || ''
        },
        theme: { color: mode === 'upi' ? '#2e7d32' : '#2874f0' }
      };

      new Razorpay(options).open();
      setButtonsDisabled(false);
    }

    init();
  </script>
</body>
</html>
