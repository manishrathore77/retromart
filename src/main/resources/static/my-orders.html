<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – RetroMart</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <span>Your Orders</span>
    </div>

    <h1 class="page-title">Returns & Orders</h1>
    <p class="text-muted" style="margin:-8px 0 20px;font-size:14px;">Track your order from placement to delivery</p>

    <div class="orders-list" id="ordersList"></div>

    <div class="empty-state hidden" id="emptyOrders">
      <div class="empty-icon">📦</div>
      <h3>No orders yet</h3>
      <p>Start shopping to see your orders here.</p>
      <a href="product-list.html" class="btn btn-primary mt-2">Browse Products</a>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="/js/common.js"></script>
  <script>
    async function init() {
      const user = await RetroMart.restoreSession();
      if (!user) {
        alert('Please sign in to view orders');
        window.location.href = 'login.html?redirect=my-orders.html';
        return;
      }
      loadOrders(user.userId);
    }

    async function loadOrders(buyerId) {
      const res = await fetch(`/api/orders/buyer/${buyerId}`);
      const orders = await res.json();
      const container = document.getElementById('ordersList');

      if (!orders.length) {
        document.getElementById('emptyOrders').classList.remove('hidden');
        return;
      }

      container.innerHTML = '';
      for (const order of orders) {
        const pRes = await fetch(`/api/products/${order.productId}`);
        const product = pRes.ok ? await pRes.json() : { title: 'Unknown Product', price: 0 };
        const imgUrl = await RetroMart.fetchProductImage(order.productId);

        const wrapper = document.createElement('div');
        wrapper.innerHTML = RetroMart.buildOrderCardHtml(order, product, imgUrl);
        container.appendChild(wrapper.firstElementChild);
      }
    }

    init();
  </script>
</body>
</html>
