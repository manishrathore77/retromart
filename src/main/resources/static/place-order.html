<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – RetroMart</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <a href="product-list.html">Products</a>
      <span>›</span>
      <span>Checkout</span>
    </div>

    <div class="checkout-card">
      <h2>Review Your Order</h2>

      <div class="order-product" id="productBox"></div>

      <div class="price-summary">
        <div class="price-row-item"><span>Item total</span><span id="itemTotal">₹0</span></div>
        <div class="price-row-item"><span>Delivery</span><span style="color:var(--success);">FREE</span></div>
        <div class="price-row-item total"><span>Order Total</span><span id="orderTotal">₹0</span></div>
      </div>

      <form id="orderForm">
        <div class="form-group">
          <label for="phone">Contact Phone</label>
          <input type="text" id="phone" name="phone" placeholder="10-digit mobile number" required />
        </div>
        <div class="form-group">
          <label for="address">Shipping Address</label>
          <textarea id="address" name="address" placeholder="House no, Street, City, State, Pincode" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Proceed to Payment</button>
        <div class="message" id="msg"></div>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="/js/common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('pid'));
    const user = RetroMart.getUser();
    const buyerId = user?.userId;
    let productPrice = 0;

    if (!buyerId) {
      alert('Please sign in first');
      window.location.href = 'login.html';
    }

    async function loadProduct() {
      const res = await fetch(`/api/products/${productId}`);
      const p = await res.json();
      productPrice = p.price;

      const imgRes = await fetch(`/api/images/product/${productId}`);
      const imgs = await imgRes.json();

      document.getElementById('productBox').innerHTML = `
        <img src="${imgs[0]?.imageUrl || 'https://via.placeholder.com/150'}" alt="${p.title}" />
        <div class="order-product-info">
          <h3>${p.title}</h3>
          <div class="price">₹${Number(p.price).toLocaleString('en-IN')}</div>
          <p>${p.description || ''}</p>
          <p style="color:var(--success);font-size:13px;">✓ In stock · FREE delivery</p>
        </div>
      `;

      const formatted = '₹' + Number(p.price).toLocaleString('en-IN');
      document.getElementById('itemTotal').textContent = formatted;
      document.getElementById('orderTotal').textContent = formatted;
    }

    loadProduct();

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const order = {
        buyerId,
        productId,
        shippingAddress: form.address.value,
        contactPhone: form.phone.value,
        paymentStatus: 'pending',
        deliveryStatus: 'processing',
        paymentMode: 'Razorpay',
        transactionId: ''
      };

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      });

      const msg = document.getElementById('msg');
      if (res.ok) {
        const text = await res.text();
        const match = text.match(/id\s+(\d+)/i);
        const newOrderId = match ? match[1] : '';
        msg.textContent = 'Order placed! Redirecting to payment...';
        msg.className = 'message success';
        setTimeout(() => {
          window.location.href = `payment.html?amount=${productPrice}&orderId=${newOrderId}`;
        }, 1200);
      } else {
        msg.textContent = await res.text();
        msg.className = 'message error';
      }
    });
  </script>
</body>
</html>
