<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Receipt – RetroMart</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .receipt-card {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      overflow: hidden;
    }
    .receipt-header {
      background: linear-gradient(135deg, var(--success) 0%, #045a47 100%);
      color: #fff;
      text-align: center;
      padding: 32px 24px;
    }
    .receipt-header .check-icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 12px;
    }
    .receipt-body { padding: 24px; }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-light);
      font-size: 14px;
    }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row .label { color: var(--text-muted); }
    .receipt-row .value { font-weight: 600; text-align: right; max-width: 60%; }
    .receipt-total {
      background: #f0faf7;
      border-radius: var(--radius-sm);
      padding: 16px;
      margin: 16px 0;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
    }
    .receipt-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .receipt-actions .btn { flex: 1; }
    @media print {
      #app-header, #app-footer, .receipt-actions, .breadcrumb { display: none !important; }
      .receipt-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <a href="my-orders.html">Orders</a>
      <span>›</span>
      <span>Receipt</span>
    </div>

    <div class="receipt-card" id="receiptCard">
      <div class="receipt-header">
        <div class="check-icon">✓</div>
        <h2 style="margin:0 0 4px;">Payment Successful!</h2>
        <p style="margin:0;opacity:.9;font-size:14px;">Thank you for shopping at RetroMart</p>
      </div>
      <div class="receipt-body" id="receiptBody">
        <p class="text-center text-muted">Loading receipt...</p>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="/js/common.js"></script>
  <script>
    const orderId = parseInt(new URLSearchParams(window.location.search).get('orderId'));
    const txnParam = new URLSearchParams(window.location.search).get('txn');
    let receiptData = null;

    function downloadReceipt() {
      if (!receiptData) return;
      const { order, product, txnId, paidAt } = receiptData;
      const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RetroMart Receipt #${order.orderId}</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 24px; color: #111; }
  h1 { color: #067d62; font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 24px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; font-size: 14px; }
  .label { color: #666; } .value { font-weight: 600; text-align: right; max-width: 55%; }
  .total { background: #f0faf7; padding: 16px; margin: 20px 0; font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; }
  .footer { text-align: center; color: #999; font-size: 12px; margin-top: 32px; }
</style></head><body>
  <h1>✓ Payment Successful</h1>
  <p class="sub">RetroMart — Tax Invoice / Receipt</p>
  <div class="row"><span class="label">Order ID</span><span class="value">#${order.orderId}</span></div>
  <div class="row"><span class="label">Transaction ID</span><span class="value">${txnId}</span></div>
  <div class="row"><span class="label">Payment Date</span><span class="value">${paidAt}</span></div>
  <div class="row"><span class="label">Payment Mode</span><span class="value">${order.paymentMode || 'Razorpay'}</span></div>
  <div class="row"><span class="label">Product</span><span class="value">${product.title}</span></div>
  <div class="row"><span class="label">Shipping Address</span><span class="value">${order.shippingAddress || '—'}</span></div>
  <div class="row"><span class="label">Contact</span><span class="value">${order.contactPhone || '—'}</span></div>
  <div class="row"><span class="label">Payment Status</span><span class="value">Paid</span></div>
  <div class="row"><span class="label">Delivery Status</span><span class="value">${order.deliveryStatus || 'processing'}</span></div>
  <div class="total"><span>Total Paid</span><span>₹${Number(product.price).toLocaleString('en-IN')}</span></div>
  <p class="footer">Thank you for shopping at RetroMart!<br>Generated on ${new Date().toLocaleString('en-IN')}</p>
</body></html>`;

      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `RetroMart-Receipt-Order-${order.orderId}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function loadReceipt() {
      const user = await RetroMart.restoreSession();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const orderRes = await fetch(`/api/orders/${orderId}`);
      if (!orderRes.ok) {
        document.getElementById('receiptBody').innerHTML = '<p class="message error">Receipt not found.</p>';
        return;
      }

      const order = await orderRes.json();
      const pRes = await fetch(`/api/products/${order.productId}`);
      const product = pRes.ok ? await pRes.json() : { title: 'Product', price: 0 };
      const txnId = txnParam || order.transactionId || '—';
      const paidAt = new Date().toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      receiptData = { order, product, txnId, paidAt };

      document.getElementById('receiptBody').innerHTML = `
        <div class="receipt-row">
          <span class="label">Order ID</span>
          <span class="value">#${order.orderId}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Transaction ID</span>
          <span class="value" style="font-size:12px;word-break:break-all;">${txnId}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Payment Date</span>
          <span class="value">${paidAt}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Payment Mode</span>
          <span class="value">${order.paymentMode || 'Razorpay'}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Product</span>
          <span class="value">${product.title}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Shipping Address</span>
          <span class="value">${order.shippingAddress || '—'}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Contact</span>
          <span class="value">${order.contactPhone || '—'}</span>
        </div>
        <div class="receipt-row">
          <span class="label">Payment Status</span>
          <span class="value"><span class="status-badge paid">Paid</span></span>
        </div>
        <div class="receipt-row">
          <span class="label">Delivery Status</span>
          <span class="value"><span class="status-badge processing">${order.deliveryStatus || 'processing'}</span></span>
        </div>
        <div class="receipt-total">
          <span>Total Paid</span>
          <span>₹${Number(product.price).toLocaleString('en-IN')}</span>
        </div>
        ${RetroMart.renderOrderTracker(order)}
        <div class="receipt-actions">
          <button class="btn btn-outline" onclick="downloadReceipt()">⬇ Download Receipt</button>
          <a href="my-orders.html" class="btn btn-primary">View Orders</a>
        </div>
      `;
    }

    loadReceipt();
  </script>
</body>
</html>
