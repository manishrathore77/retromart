<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products – RetroMart</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <span id="breadcrumbLabel">All Products</span>
    </div>

    <div class="products-layout">
      <aside class="filters-sidebar">
        <h3>Categories</h3>
        <div class="filter-group" id="categoryFilters">
          <label><input type="radio" name="category" value="" checked /> All Products</label>
          <label><input type="radio" name="category" value="electronics" /> Electronics</label>
          <label><input type="radio" name="category" value="fashion" /> Fashion</label>
          <label><input type="radio" name="category" value="home" /> Home & Kitchen</label>
          <label><input type="radio" name="category" value="books" /> Books</label>
          <label><input type="radio" name="category" value="sports" /> Sports</label>
        </div>
        <h3>Filters</h3>
        <div class="filter-group">
          <label><input type="checkbox" id="filterDeals" /> Deals & Discounts</label>
          <label><input type="checkbox" id="filterRating" /> 4★ & above</label>
        </div>
        <h3>Price</h3>
        <div class="filter-group">
          <label><input type="radio" name="price" value="all" checked /> All</label>
          <label><input type="radio" name="price" value="500" /> Under ₹500</label>
          <label><input type="radio" name="price" value="1000" /> ₹500 – ₹1,000</label>
          <label><input type="radio" name="price" value="5000" /> Above ₹1,000</label>
        </div>
        <h3>Sort By</h3>
        <div class="filter-group">
          <select id="sortSelect" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-family:inherit;">
            <option value="relevance">Relevance</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </div>
      </aside>

      <section>
        <div class="section-header">
          <h2 id="pageTitle">All Products</h2>
          <span class="text-muted" id="resultCount"></span>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="/js/common.js"></script>
  <script>
    let allProducts = [];

    const CATEGORY_LABELS = {
      electronics: 'Electronics',
      fashion: 'Fashion',
      home: 'Home & Kitchen',
      books: 'Books',
      sports: 'Sports'
    };

    function getCategory() {
      return new URLSearchParams(window.location.search).get('category')?.trim().toLowerCase() || '';
    }

    function getSearchQuery() {
      const q = new URLSearchParams(window.location.search).get('q');
      return q ? q.trim() : '';
    }

    function filterByQuery(products, query) {
      if (!query) return products;
      const lower = query.toLowerCase();
      return products.filter(p =>
        p.title.toLowerCase().includes(lower) ||
        (p.description && p.description.toLowerCase().includes(lower))
      );
    }

    function updateUI(category, query) {
      if (query) {
        document.getElementById('pageTitle').textContent = `Results for "${query}"`;
        document.getElementById('breadcrumbLabel').textContent = `Search: ${query}`;
      } else if (category) {
        const label = CATEGORY_LABELS[category] || category;
        document.getElementById('pageTitle').textContent = label;
        document.getElementById('breadcrumbLabel').textContent = label;
      } else {
        document.getElementById('pageTitle').textContent = 'All Products';
        document.getElementById('breadcrumbLabel').textContent = 'All Products';
      }

      const catRadio = document.querySelector(`input[name="category"][value="${category}"]`);
      if (catRadio) catRadio.checked = true;
    }

    async function loadProducts() {
      const category = getCategory();
      const query = getSearchQuery();

      let url = '/api/products';
      if (category) url += `?category=${encodeURIComponent(category)}`;

      const res = await fetch(url);
      if (!res.ok) {
        document.getElementById('productGrid').innerHTML =
          '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">⚠️</div><p>Failed to load products.</p></div>';
        return;
      }

      let products = await res.json();
      allProducts = filterByQuery(products, query);
      updateUI(category, query);
      applyFilters();
    }

    function applyFilters() {
      let filtered = [...allProducts];
      const priceFilter = document.querySelector('input[name="price"]:checked')?.value;

      if (priceFilter === '500') filtered = filtered.filter(p => p.price < 500);
      else if (priceFilter === '1000') filtered = filtered.filter(p => p.price >= 500 && p.price <= 1000);
      else if (priceFilter === '5000') filtered = filtered.filter(p => p.price > 1000);

      const sort = document.getElementById('sortSelect').value;
      if (sort === 'price-low') filtered.sort((a, b) => a.price - b.price);
      else if (sort === 'price-high') filtered.sort((a, b) => b.price - a.price);
      else if (sort === 'name') filtered.sort((a, b) => a.title.localeCompare(b.title));

      document.getElementById('resultCount').textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`;
      RetroMart.loadProductsIntoGrid(document.getElementById('productGrid'), filtered);
    }

    document.querySelectorAll('.filters-sidebar input[name="category"]').forEach(el => {
      el.addEventListener('change', () => {
        const cat = el.value;
        const q = getSearchQuery();
        let url = '/product-list.html';
        const params = new URLSearchParams();
        if (cat) params.set('category', cat);
        if (q) params.set('q', q);
        if (params.toString()) url += '?' + params.toString();
        window.location.href = url;
      });
    });

    document.querySelectorAll('.filters-sidebar input[name="price"], .filters-sidebar input[type="checkbox"]').forEach(el => {
      el.addEventListener('change', applyFilters);
    });
    document.getElementById('sortSelect').addEventListener('change', applyFilters);

    document.addEventListener('DOMContentLoaded', loadProducts);
    window.addEventListener('popstate', loadProducts);
  </script>
</body>
</html>
