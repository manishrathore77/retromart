<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Products</title>
  <style>
    body {
      font-family: Arial;
      background: #f9f9f9;
      margin: 20px;
    }
    h2 {
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
    }
    .card p {
      color: #333;
      margin-bottom: 10px;
    }
    .card button {
      background: teal;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .card button:hover {
      background: #006666;
    }
  </style>
</head>
<body>
  <h2>🛒 All Products</h2>

  <div class="grid" id="productGrid">
    <!-- Cards will be added here dynamically -->
  </div>

  <script>
    async function loadProducts() {
      const res = await fetch("/api/products");
      if (!res.ok) return alert("Failed to load products");
      const products = await res.json();

      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      for (const p of products) {
        const card = document.createElement("div");
        card.className = "card";

        // Try to get main image (first one)
        let imgUrl = "";
        try {
          const res = await fetch(`/api/images/product/${p.productId}`);//done
          const imgs = await res.json();
          if (imgs.length) imgUrl = imgs[0].imageUrl;
        } catch (e) {
          console.log("No image found");
        }

        card.innerHTML = `
          <img src="${imgUrl || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="Product">
          <h3>${p.title}</h3>
          <p>₹${p.price.toFixed(2)}</p>
          <button onclick="viewDetails(${p.productId})">View</button>
        `;
        grid.appendChild(card);
      }
    }

    function viewDetails(pid) {
      window.location.href = `product-details.html?pid=${pid}`;
    }

    loadProducts();
  </script>
</body>
</html>
